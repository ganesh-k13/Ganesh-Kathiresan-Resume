<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganesh Kathiresan - Resume</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            background-color: #161b22;
            border-bottom: 1px solid #21262d;
            padding: 16px 32px;
        }

        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .content {
            padding: 32px;
        }

        #pdf-content {
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 800px;
        }

        #pdf-content embed {
            width: 100%;
            height: 100%;
            border: 1px solid #21262d;
            border-radius: 6px;
        }

        .download-link {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 16px;
            background-color: #238636;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
        }

        .download-link:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📄 Ganesh Kathiresan - Resume</h1>
        </div>
    </header>

    <div class="container content">
        <div id="pdf-content">
            <embed src="ganeshk.pdf" type="application/pdf" />
            <p style="text-align: center; margin-top: 16px;">
                <a href="ganeshk.pdf" class="download-link" download>📥 Download PDF Resume</a>
            </p>
        </div>
    </div>
</body>
</html>
